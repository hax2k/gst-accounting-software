<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Celestret">
  <!-- Warm paper canvas -->
  <rect width="32" height="32" rx="8" fill="#F5F1E8"/>
  <!-- Near-black tile -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="6.5" fill="#2A2722"/>
  <!-- HK monogram -->
  <g fill="#F7F4ED">
    <!-- H -->
    <rect x="8" y="9" width="2.4" height="11"/>
    <rect x="13.2" y="9" width="2.4" height="11"/>
    <rect x="8" y="13.3" width="7.6" height="2.3"/>
    <!-- K -->
    <rect x="17.8" y="9" width="2.4" height="11"/>
    <polygon points="20.2,13.8 25.4,9 28,9 22.2,14.5 28,20 25.4,20 20.2,15.2"/>
  </g>
  <!-- Money-in accent -->
  <rect x="8" y="23.2" width="16" height="1.8" rx="0.9" fill="#2F8F6B"/>
</svg>
